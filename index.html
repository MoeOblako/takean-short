<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Перенаправление...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #e8e8e8;
        }
    </style>
</head>
<body>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBDzDIwiObevnlfqfm6p9fzAvsHHpT2QZU",
            authDomain: "takean.firebaseapp.com",
            projectId: "takean",
            storageBucket: "takean.firebasestorage.app",
            messagingSenderId: "359116659063",
            appId: "1:359116659063:web:eb81859e5a8f885e546972",
            measurementId: "G-VXLM679GKK"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Функция мгновенной переадресации на 404
        function redirectTo404() {
            window.location.replace('https://takean.cl.is/404');
        }

        // ============================================================
        // ПОЛУЧАЕМ ID ИЗ URL
        // ============================================================
        let shortId = null;
        const path = window.location.pathname;
        const urlParams = new URLSearchParams(window.location.search);
        
        const pathMatch = path.match(/\/(\d+)/);
        if (pathMatch) {
            shortId = pathMatch[1];
        } else if (urlParams.has('id')) {
            shortId = urlParams.get('id');
        }

        // ============================================================
        // ПОИСК ПОСТА ПО КОРОТКОМУ ID
        // ============================================================
        function findPostByShortId(id) {
            const idStr = String(id).trim();
            if (!idStr) return Promise.reject('ID пустой');

            return db.collection('posts')
                .where('shortId', '==', idStr)
                .limit(1)
                .get()
                .then(snapshot => {
                    if (snapshot.empty) {
                        return db.collection('posts')
                            .where('order', '==', parseInt(idStr))
                            .limit(1)
                            .get()
                            .then(snapshot2 => {
                                if (snapshot2.empty) {
                                    throw new Error('Пост не найден');
                                }
                                return snapshot2.docs[0];
                            });
                    }
                    return snapshot.docs[0];
                })
                .then(doc => {
                    return { id: doc.id, ...doc.data() };
                });
        }

        // ============================================================
        // ОСНОВНАЯ ЛОГИКА
        // ============================================================
        if (!shortId) {
            redirectTo404();
        } else {
            findPostByShortId(shortId)
                .then(post => {
                    // Мгновенный редирект на целевой пост без задержки setTimeout
                    window.location.replace(`https://takean.cl.is/post.html?id=${post.id}`);
                })
                .catch(() => {
                    redirectTo404();
                });
        }
    </script>
</body>
</html>
